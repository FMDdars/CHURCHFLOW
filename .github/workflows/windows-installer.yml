name: Build and publish ChurchFlow for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize releases so concurrent runs cannot publish an older version last.
concurrency:
  group: churchflow-windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out ChurchFlow
        uses: actions/checkout@v4

      - name: Verify the ChurchFlow logo for offline packaging
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/churchflow.png")) {
            throw "The ChurchFlow logo is missing from the repository."
          }
          $logo = [System.IO.File]::ReadAllBytes("assets/churchflow.png")
          if ($logo.Length -lt 1000 -or $logo[0] -ne 0x89 -or $logo[1] -ne 0x50 -or $logo[2] -ne 0x4E -or $logo[3] -ne 0x47) {
            throw "The repository ChurchFlow logo is not a valid PNG."
          }

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install

      - name: Build Electron-compatible NDI native addon
        run: node_modules/.bin/node-gyp.cmd rebuild --directory native/ndi --arch=x64 --target=45.2.3 --dist-url=https://electronjs.org/headers

      - name: Check project files and JavaScript syntax
        run: npm run check

      - name: Assign a unique release version
        run: npm version "0.9.${{ github.run_number }}" --no-git-tag-version

      - name: Create release tag for the updater
        shell: bash
        run: |
          git tag "v0.9.${{ github.run_number }}"
          git push origin "v0.9.${{ github.run_number }}"

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "v0.9.${{ github.run_number }}" \
            --verify-tag \
            --title "ChurchFlow 0.9.${{ github.run_number }}" \
            --notes "ChurchFlow Windows release with automatic in-app updates. NDI output uses dynamic loading and requires the official NDI Runtime 6 to be installed separately; the runtime is not bundled."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first. Uploading with gh explicitly ensures latest.yml is
      # attached to the exact release that the GitHub updater checks.
      - name: Build Windows installer and portable app
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify updater metadata and both Windows packages
        shell: pwsh
        run: |
          $required = @(
            "dist/latest.yml",
            "dist/ChurchFlow-Setup-0.9.${{ github.run_number }}-x64.exe",
            "dist/ChurchFlow-Portable-0.9.${{ github.run_number }}-x64.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required release file was not generated: $file" }
          }
          $metadata = Get-Content "dist/latest.yml" -Raw
          if ($metadata -notmatch "(?m)^path: ChurchFlow-Setup-") {
            throw "latest.yml does not point to the ChurchFlow installer."
          }
          if ($metadata -notmatch "(?m)^sha512: ") {
            throw "latest.yml is missing the installer SHA-512 checksum."
          }

      - name: Upload installer, portable build and updater metadata to GitHub Release
        shell: pwsh
        run: |
          $assets = Get-ChildItem "dist" -File | Where-Object {
            $_.Name -match "^(ChurchFlow-(Setup|Portable)-.*\.exe(\.blockmap)?|latest\.yml)$"
          }
          if (-not ($assets.Name -contains "latest.yml")) {
            throw "latest.yml is not present in the release upload set."
          }
          gh release upload "v0.9.${{ github.run_number }}" --clobber -- $assets.FullName
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release contains updater metadata
        shell: bash
        run: |
          gh release view "v0.9.${{ github.run_number }}" --json assets --jq '.assets[].name' | grep -Fx "latest.yml"
          gh release view "v0.9.${{ github.run_number }}" --json assets --jq '.assets[].name' | grep -E '^ChurchFlow-Setup-.*\.exe$'

      - name: Keep a copy of Windows build files in Actions
        uses: actions/upload-artifact@v4
        with:
          name: ChurchFlow-Windows-x64-v0.9.${{ github.run_number }}
          path: |
            dist/ChurchFlow-Setup-0.9.${{ github.run_number }}-x64.exe
            dist/ChurchFlow-Portable-0.9.${{ github.run_number }}-x64.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
