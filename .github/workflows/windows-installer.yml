name: Build and publish ChurchFlow for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize releases so concurrent runs cannot publish an older version last.
concurrency:
  group: churchflow-windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out ChurchFlow
        uses: actions/checkout@v4

      - name: Download the ChurchFlow logo for offline packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          curl.exe --fail --location --retry 3 --retry-all-errors --output assets/churchflow-logo.jpg "https://i.ibb.co/KxxrKggz/churchflow-logo.jpg"
          $logo = [System.IO.File]::ReadAllBytes("assets/churchflow-logo.jpg")
          if ($logo.Length -lt 1000 -or $logo[0] -ne 0xFF -or $logo[1] -ne 0xD8 -or $logo[2] -ne 0xFF) {
            throw "The hosted ChurchFlow logo could not be downloaded as a valid JPEG."
          }

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install

      - name: Build Electron-compatible NDI native addon
        run: node_modules/.bin/node-gyp.cmd rebuild --directory native/ndi --arch=x64 --target=45.2.3 --dist-url=https://electronjs.org/headers

      - name: Check project files and JavaScript syntax
        run: npm run check

      - name: Assign a unique release version
        run: npm version "0.9.${{ github.run_number }}" --no-git-tag-version

      - name: Create release tag for the updater
        shell: bash
        run: |
          git tag "v0.9.${{ github.run_number }}"
          git push origin "v0.9.${{ github.run_number }}"

      - name: Create one GitHub release before uploading assets
        shell: bash
        run: |
          gh release create "v0.9.${{ github.run_number }}" \
            --verify-tag \
            --title "ChurchFlow 0.9.${{ github.run_number }}" \
            --notes "ChurchFlow Windows release with automatic in-app updates. NDI output is available only when a complete, authorized NDI native runtime bundle is included; otherwise the NDI feature remains unavailable in this build."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Windows installer and portable app
        run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep a copy of Windows build files in Actions
        uses: actions/upload-artifact@v4
        with:
          name: ChurchFlow-Windows-x64-v0.9.${{ github.run_number }}
          path: |
            dist/ChurchFlow-Setup-0.9.${{ github.run_number }}-x64.exe
            dist/ChurchFlow-Portable-0.9.${{ github.run_number }}-x64.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
