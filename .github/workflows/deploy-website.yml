name: Deploy ChurchFlow website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: churchflow-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Copy official ChurchFlow logo into website
        run: |
          mkdir -p website/assets
          cp assets/churchflow-logo-chevrons.png website/assets/churchflow-logo-chevrons.png
          cp assets/churchflow-logo-chevrons.png website/assets/churchflow.png
          cp assets/churchflow.ico website/assets/churchflow.ico

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
