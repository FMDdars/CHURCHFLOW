<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChurchFlow Audience Display</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;color:#fff;font-family:Arial,sans-serif}
    body{display:block}
    main{padding:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;text-align:left;background:transparent}
    p{font-size:clamp(22px,3vw,54px);line-height:1.25;white-space:pre-wrap;margin:0;max-width:100vw}
    img{display:block;width:100vw;height:100vh;object-fit:contain;background:transparent}
  </style>
</head>
<body>
  <main id="screen"></main>
  <script>
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'renderImage') {
        if (data.blank) { document.body.style.visibility = 'hidden'; return; }
        document.body.style.visibility = 'visible';
        document.querySelector('img')?.remove();
        const main = document.querySelector('main');
        if (main) main.remove();
        const image = document.createElement('img');
        image.alt = 'ChurchFlow presentation slide';
        image.src = data.dataUrl;
        document.body.append(image);
        return;
      }
      if (data.type !== 'render') return;
      if (data.blank) { document.body.style.visibility = 'hidden'; return; }
      document.body.style.visibility = 'visible';
      document.querySelector('img')?.remove();
      let main = document.querySelector('main');
      if (!main) { main = document.createElement('main'); main.id = 'screen'; document.body.append(main); }
      const item = data.item;
      const slides = (item?.body || '').split(/\n---\n/g).map((part) => part.trim()).filter(Boolean);
      main.innerHTML = '';
      const paragraph = document.createElement('p'); paragraph.textContent = slides[data.index] || '';
      main.append(paragraph);
    });
  </script>
</body>
</html>
